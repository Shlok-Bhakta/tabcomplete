<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f141b">
<title>TabComplete</title>
<link rel="stylesheet" href="vendor/codemirror.min.css">
<style>
  :root {
    --bg: #0f141b;
    --bar: #141b24;
    --border: #2c3746;
    --text: #e8edf3;
    --muted: #9aa7b8;
    --accent: #5eb1ff;
    --good: #7ee2a8;
    --bad: #ff7a90;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--sans); line-height: 1.45;
    height: 100dvh; display: flex; flex-direction: column;
    overscroll-behavior-y: none;
  }
  /* Slim top bar: name, model, telemetry dot, settings toggle. */
  #topbar {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; background: var(--bar);
    border-bottom: 1px solid var(--border);
    flex: 0 0 auto; min-height: 48px;
  }
  #topbar .logo { font-weight: 700; font-size: 15px; white-space: nowrap; }
  #topbar .logo span { color: var(--accent); }
  #model {
    flex: 1 1 auto; min-width: 0; background: #0c1117; color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px; font-size: 16px;
  }
  #dot {
    flex: 0 0 auto; width: 10px; height: 10px; border-radius: 50%;
    background: var(--muted);
  }
  #dot.ok { background: var(--good); }
  #dot.bad { background: var(--bad); }
  #dot.busy { background: var(--accent); }
  #settingsBtn {
    flex: 0 0 auto; background: transparent; color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    min-width: 48px; min-height: 44px; font-size: 20px; cursor: pointer;
  }
  /* Settings drawer: hidden by default so the editor owns the screen. */
  #settings {
    flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 8px;
    padding: 8px 10px; background: var(--bar);
    border-bottom: 1px solid var(--border); font-size: 14px;
  }
  #settings[hidden] { display: none; }
  #settings label { color: var(--muted); font-size: 12px; display: flex; flex-direction: column; gap: 2px; }
  #settings select, #settings input {
    background: #0c1117; color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px; font-size: 16px; max-width: 42vw;
  }
  #settings input[type="range"] { max-width: 30vw; accent-color: var(--accent); }
  /* The editor owns the viewport. */
  #editorArea { flex: 1 1 auto; min-height: 0; position: relative; }
  #editorArea .CodeMirror {
    position: absolute; inset: 0; height: 100%;
    font-family: var(--mono); font-size: 15px; line-height: 1.55;
    background: #0c1117; color: var(--text);
  }
  #editorArea .CodeMirror-gutters { background: #0a0e13; border-right: 1px solid var(--border); }
  #editorArea .CodeMirror-linenumber { color: #5c6b80; }
  #editorArea .CodeMirror-cursor { border-left-color: var(--accent); }
  .ghost-widget {
    color: var(--good); opacity: .85; font-family: var(--mono); font-size: 13px;
    white-space: pre-wrap; word-break: break-word;
    border-left: 2px solid var(--good); padding: 2px 8px; margin: 2px 0;
  }
  /* Suggestion sheet docks directly above the action bar. */
  #sheet {
    flex: 0 0 auto; border-top: 1px solid var(--border); background: #0e1621;
    max-height: 42dvh; display: flex; flex-direction: column;
  }
  #sheet[hidden] { display: none; }
  #sheetBar {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px 0;
    font-size: 13px; color: var(--muted);
  }
  #sheetBar strong { color: var(--text); }
  #sheetText {
    margin: 8px 10px; padding: 10px; background: #0a0f16;
    border: 1px solid var(--border); border-radius: 8px;
    font-family: var(--mono); font-size: 13.5px; line-height: 1.5;
    white-space: pre-wrap; word-break: break-word;
    overflow: auto; max-height: 22dvh;
  }
  #sheetActions { display: flex; gap: 8px; padding: 0 10px 10px; }
  #sheetActions button {
    flex: 1 1 0; min-height: 52px; font-size: 17px; font-weight: 700;
    border-radius: 10px; border: 0; cursor: pointer;
  }
  #acceptBtn { background: var(--good); color: #0c2417; }
  #rejectBtn { background: transparent; color: var(--text); border: 1px solid var(--border) !important; font-weight: 600 !important; }
  /* Bottom action bar: one big button + one status line. */
  #actionbar {
    flex: 0 0 auto; padding: 8px 10px calc(10px + env(safe-area-inset-bottom));
    background: var(--bar); border-top: 1px solid var(--border);
  }
  #completeBtn {
    width: 100%; min-height: 54px; font-size: 17px; font-weight: 700;
    background: var(--accent); color: #06121f; border: 0; border-radius: 12px;
    cursor: pointer; touch-action: manipulation;
  }
  #completeBtn:disabled { opacity: .55; cursor: wait; }
  #status { margin-top: 6px; font-size: 12px; color: var(--muted); min-height: 16px; }
  #status.err { color: var(--bad); }
</style>
</head>
<body>
<header id="topbar">
  <span class="logo">TabComplete <span>·</span> local</span>
  <select id="model" aria-label="Completion model"><option value="">loading…</option></select>
  <span id="dot" title="telemetry state" aria-label="telemetry state"></span>
  <button id="settingsBtn" type="button" aria-label="Settings" aria-expanded="false">⋯</button>
</header>

<div id="settings" hidden>
  <label>Task
    <select id="taskMode">
      <option value="next_edit" selected>next edit</option>
      <option value="autocomplete">autocomplete</option>
    </select>
  </label>
  <label>Language
    <select id="language">
      <option value="python" selected>python</option>
      <option value="javascript">javascript</option>
      <option value="typescript">typescript</option>
      <option value="rust">rust</option>
      <option value="go">go</option>
      <option value="java">java</option>
      <option value="cpp">c++</option>
      <option value="c">c</option>
      <option value="csharp">c#</option>
      <option value="shell">shell</option>
      <option value="text">text</option>
    </select>
  </label>
  <label>File
    <input type="text" id="targetPath" value="main.py" autocomplete="off" autocapitalize="off">
  </label>
  <label>Tokens
    <input type="range" id="maxTokens" min="1" max="256" value="64">
  </label>
</div>

<div id="editorArea">
  <textarea id="code" aria-label="Code editor"></textarea>
</div>

<section id="sheet" hidden aria-live="polite">
  <div id="sheetBar"><strong>Suggestion</strong><span id="sheetMeta"></span></div>
  <pre id="sheetText" tabindex="0"></pre>
  <div id="sheetActions">
    <button id="acceptBtn" type="button">Accept</button>
    <button id="rejectBtn" type="button">Reject</button>
  </div>
</section>

<footer id="actionbar">
  <button id="completeBtn" type="button">Complete</button>
  <div id="status" aria-live="polite"></div>
</footer>

<script src="vendor/codemirror.min.js"></script>
<script src="vendor/mode/python/python.js"></script>
<script src="vendor/mode/javascript/javascript.js"></script>
<script src="vendor/mode/clike/clike.js"></script>
<script src="vendor/mode/shell/shell.js"></script>
<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var modelSel = $("model"), dot = $("dot"), settingsBtn = $("settingsBtn"),
      settings = $("settings"), taskMode = $("taskMode"), language = $("language"),
      targetPath = $("targetPath"), maxTokens = $("maxTokens"),
      sheet = $("sheet"), sheetMeta = $("sheetMeta"), sheetText = $("sheetText"),
      acceptBtn = $("acceptBtn"), rejectBtn = $("rejectBtn"),
      completeBtn = $("completeBtn"), statusEl = $("status");

  var STARTER = "def fibonacci(n: int) -> list[int]:\n"
    + '    """Return the first n Fibonacci numbers."""\n'
    + "    if n <= 0:\n"
    + "        return []\n"
    + "    out = [0, 1]\n"
    + "    while len(out) < n:\n"
    + "        out.append(out[-1] + out[-2])\n"
    + "    return out[:n]\n"
    + "\n"
    + "\n"
    + "def add(a, b):\n"
    + "    ";

  function setText(el, s) { el.textContent = s == null ? "" : String(s); }
  function status(msg, isErr) {
    setText(statusEl, msg);
    statusEl.classList.toggle("err", !!isErr);
  }
  function newId() {
    if (window.crypto && crypto.randomUUID) { try { return crypto.randomUUID(); } catch (e) {} }
    return "req-" + Date.now().toString(36) + "-" + Math.floor(Math.random() * 1e9).toString(36);
  }

  /* Pure-JS SHA-256 (no SubtleCrypto: plain-http tailnet is not a secure
     context on mobile, so crypto.subtle is often undefined). Input is
     UTF-8 encoded first via unescape/encodeURIComponent. Verified against
     sha256sum on ASCII, multi-block, and unicode vectors. */
  function sha256ascii(ascii) {
    function rr(v, a) { return (v >>> a) | (v << (32 - a)); }
    var maxWord = Math.pow(2, 32);
    var i, j;
    var result = "";
    var words = [];
    var bitLen = ascii.length * 8;
    var hash = (sha256ascii.h = sha256ascii.h || []);
    var kk = (sha256ascii.k = sha256ascii.k || []);
    var primeCounter = kk.length;
    var isComposite = {};
    for (var candidate = 2; primeCounter < 64; candidate++) {
      if (!isComposite[candidate]) {
        for (i = 0; i < 313; i += candidate) { isComposite[i] = candidate; }
        hash[primeCounter] = (Math.pow(candidate, 0.5) * maxWord) | 0;
        kk[primeCounter++] = (Math.pow(candidate, 1 / 3) * maxWord) | 0;
      }
    }
    ascii += String.fromCharCode(128);
    while ((ascii.length % 64) - 56) ascii += String.fromCharCode(0);
    for (i = 0; i < ascii.length; i++) {
      j = ascii.charCodeAt(i);
      if (j >> 8) return "";
      words[i >> 2] |= j << (((3 - i) % 4) * 8);
    }
    words[words.length] = (bitLen / maxWord) | 0;
    words[words.length] = bitLen;
    for (j = 0; j < words.length;) {
      var w = words.slice(j, (j += 16));
      var oldHash = hash;
      hash = hash.slice(0, 8);
      for (i = 0; i < 64; i++) {
        var w15 = w[i - 15], w2 = w[i - 2];
        var a = hash[0], e = hash[4];
        var temp1 = hash[7]
          + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25))
          + ((e & hash[5]) ^ (~e & hash[6]))
          + kk[i]
          + (w[i] = i < 16 ? w[i] : (w[i - 16]
            + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3))
            + w[i - 7]
            + (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))) | 0);
        var temp2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22))
          + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
        hash = [(temp1 + temp2) | 0].concat(hash);
        hash[4] = (hash[4] + temp1) | 0;
      }
      for (i = 0; i < 8; i++) { hash[i] = (hash[i] + oldHash[i]) | 0; }
    }
    for (i = 0; i < 8; i++) {
      for (j = 3; j + 1; j--) {
        var b2 = (hash[i] >> (j * 8)) & 255;
        result += ((b2 < 16) ? "0" : "") + b2.toString(16);
      }
    }
    return result;
  }
  function sha256(s) { return sha256ascii(unescape(encodeURIComponent(s))); }
  function b64utf8(s) { return btoa(unescape(encodeURIComponent(s))); }

  /* ---- Editor (CodeMirror 5, vendored: no CDN, works offline) ---- */
  if (!window.CodeMirror) {
    status("Editor failed to load (vendor/codemirror.min.js missing).", true);
    return;
  }
  var MODES = { python: "python", javascript: "javascript", typescript: "text/typescript",
    rust: "text/x-rustsrc", go: "text/x-go", java: "text/x-java", cpp: "text/x-c++src",
    c: "text/x-csrc", csharp: "text/x-csharp", shell: "shell", text: null };
  var cm = window.CodeMirror.fromTextArea($("code"), {
    lineNumbers: true, lineWrapping: true, indentUnit: 4, tabSize: 4,
    mode: "python", viewportMargin: 20
  });
  cm.setValue(STARTER);
  cm.setCursor({ line: cm.lineCount() - 1, ch: 0 });
  function applyMode() {
    var m = MODES[language.value];
    cm.setOption("mode", m == null ? null : m);
  }
  language.addEventListener("change", applyMode);

  var pending = null; // {id, text, model, start, end, noop, latencyMs, generatedTokens}
  var ghostWidget = null;
  function clearGhost() {
    if (ghostWidget) { ghostWidget.clear(); ghostWidget = null; }
  }
  function renderGhost() {
    clearGhost();
    if (!pending) return;
    var preview = pending.noop ? "NO_EDIT" : pending.text;
    if (preview.length > 160) preview = preview.slice(0, 160) + "…";
    var node = document.createElement("div");
    node.className = "ghost-widget";
    setText(node, (pending.noop ? "" : "✎ ") + preview);
    var cur = cm.getCursor();
    ghostWidget = cm.addLineWidget(cur.line, node, { coverGutter: false, noHScroll: true });
  }
  cm.on("change", function () {
    if (pending) {
      // User typed past the suggestion: record it as superseded so every
      // shown proposal ends with exactly one resolution event.
      supersedePending("superseded");
    } else {
      clearPending();
    }
  });

  function clearPending() {
    pending = null;
    clearGhost();
    sheet.hidden = true;
  }

  // Claim the pending suggestion before mutating the document, so the
  // change handler above does not also log it as superseded.
  function takePending() {
    var done = pending;
    pending = null;
    clearGhost();
    sheet.hidden = true;
    return done;
  }

  function supersedePending(reason) {
    var done = takePending();
    if (!done) return;
    var cur = cmCursor();
    sendEvents([ev("prediction_rejected", {
      prediction_id: done.id, provider: "tabcomplete-local", model: done.model,
      file: docPath(), cursor: cur,
      total_chars: done.text.length, finish_reason: reason
    }, cur)]);
  }

  /* ---- Telemetry: same event protocol the Neovim plugin speaks ---- */
  var machineId = null, sessionId = newId(), seq = 0, telemetryOk = false;
  try { machineId = window.localStorage.getItem("tc_machine_id"); } catch (e) {}
  if (!machineId) {
    machineId = newId();
    try { window.localStorage.setItem("tc_machine_id", machineId); } catch (e) {}
  }
  function markTelemetry(ok) {
    telemetryOk = ok;
    dot.className = ok ? "ok" : "bad";
  }
  function postTelemetry(path, body) {
    return fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(function (res) {
      return res.json().then(function (j) {
        if (!res.ok) {
          var err = new Error((j && (j.message || j.error)) || ("HTTP " + res.status));
          err.status = res.status;
          throw err;
        }
        return j;
      });
    });
  }
  function sendEvents(events) {
    if (!events.length) return Promise.resolve();
    return postTelemetry("/api/telemetry/events", { protocol_version: 1, events: events })
      .then(function () { markTelemetry(true); })
      .catch(function () { markTelemetry(false); });
  }
  function ev(type, payload, cursor) {
    return {
      protocol_version: 1, event_id: newId(), session_id: sessionId,
      sequence_number: seq++, timestamp_ms: Date.now(), event_type: type,
      file_id: null, changedtick: null,
      cursor: cursor || null, mode: null, payload: payload
    };
  }
  function cmCursor() {
    var c = cm.getCursor();
    return { row: c.line, col: c.ch };
  }
  function docPath() { return (targetPath.value || "").trim() || "untitled.txt"; }

  function anchorBuffer(reason) {
    var text = cm.getValue(), hash = sha256(text);
    var afterBlob = postTelemetry("/api/telemetry/blobs/check", { hashes: [hash] })
      .then(function (j) {
        var missing = (j && j.missing) || [];
        if (missing.indexOf(hash) === -1) return { uploaded: true };
        return postTelemetry("/api/telemetry/blobs/upload", {
          sha256: hash, content_base64: b64utf8(text), mime_type: "text/plain"
        }).then(function () { return { uploaded: true }; });
      })
      .catch(function () { return { uploaded: false }; });
    return afterBlob.then(function (r) {
      return sendEvents([ev("buffer_open", {
        path: docPath(), content_hash: hash, content_bytes: text.length,
        blob_uploaded: r.uploaded, line_count: cm.lineCount(), reason: reason
      }, cmCursor())]);
    });
  }
  function startSession() {
    dot.className = "busy";
    postTelemetry("/api/telemetry/session", {
      protocol_version: 1, session_id: sessionId, machine_id: machineId,
      repo_id: "repo:playground-web", started_at: new Date().toISOString(),
      cwd_name: "playground-web", editor: "web",
      editor_version: "playground/1", plugin_version: "web-ui/1",
      platform: navigator.platform || "mobile",
      root_name: "playground-web"
    }).then(function () { return anchorBuffer("session_start"); })
      .then(function () { markTelemetry(true); })
      .catch(function () { markTelemetry(false); });
  }

  /* ---- Completion flow ---- */
  var busy = false;
  function setBusy(b) {
    busy = b;
    completeBtn.disabled = b;
    if (b) dot.className = "busy";
    else if (telemetryOk) dot.className = "ok";
  }

  function docOffsets() {
    var sels = cm.listSelections();
    var head = sels.length ? sels[0].head : cm.getCursor();
    var anchor = sels.length ? sels[0].anchor : head;
    var start = cm.indexFromPos(anchor), end = cm.indexFromPos(head);
    if (taskMode.value !== "next_edit") end = start;
    return { start: Math.min(start, end), end: Math.max(start, end) };
  }

  function doComplete() {
    if (busy || !window.CodeMirror) return;
    var model = modelSel.value;
    if (!model) { status("No model yet — waiting for GET /api/models.", true); return; }
    supersedePending("superseded");
    status("");
    var full = cm.getValue();
    var range = docOffsets();
    var prefix = full.slice(0, range.start), region = full.slice(range.start, range.end),
        suffix = full.slice(range.end);
    var toks = Math.max(1, Math.min(256, parseInt(maxTokens.value, 10) || 64));
    var predictionId = newId();
    var cursor = cmCursor();
    var contextHash = sha256(docPath() + "\n" + prefix + "\n" + region + "\n" + suffix);
    sendEvents([ev("prediction_requested", {
      prediction_id: predictionId, provider: "tabcomplete-local", model: model,
      requested_at_ms: Date.now(), max_output_tokens: toks, temperature: 0,
      context_hash: contextHash, file: docPath(), cursor: cursor
    }, cursor)]);
    setBusy(true);
    status("working…");
    var t0 = performance.now();
    fetch("/api/complete", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: model, mode: taskMode.value, language: language.value,
        path: docPath(), prefix: prefix, region: region, suffix: suffix,
        recent_edits: [], context_files: [], max_new_tokens: toks
      })
    }).then(function (res) {
      if (!res.ok) {
        return res.json().catch(function () { return {}; }).then(function (j) {
          throw new Error(j.error || ("complete failed: HTTP " + res.status));
        });
      }
      return res.json();
    }).then(function (data) {
      var text = typeof data.text === "string" ? data.text : "";
      var clientMs = Math.round(performance.now() - t0);
      var serverMs = typeof data.latency_ms === "number" ? Math.round(data.latency_ms) : clientMs;
      var genTokens = typeof data.generated_tokens === "number" ? data.generated_tokens : 0;
      if (cm.getValue() !== full) {
        // Typed while the model was running: offsets are stale. Log the
        // response honestly, resolve it as stale, and ask for a fresh run.
        var cur0 = cmCursor();
        sendEvents([
          ev("prediction_shown", {
            prediction_id: predictionId, provider: "tabcomplete-local", model: model,
            responded_at_ms: Date.now(), latency_ms: serverMs,
            context_hash: contextHash, file: docPath(), cursor: cur0,
            proposed_start: cur0, proposed_end: cur0, proposed_text: text,
            max_output_tokens: toks, temperature: 0, total_chars: text.length,
            finish_reason: "stop"
          }, cur0),
          ev("prediction_rejected", {
            prediction_id: predictionId, provider: "tabcomplete-local", model: model,
            file: docPath(), cursor: cur0,
            total_chars: text.length, finish_reason: "stale"
          }, cur0)
        ]);
        status("Changed while working — run again for a fresh suggestion.", true);
        return;
      }
      pending = {
        id: predictionId, text: text, model: model,
        start: range.start, end: range.end, noop: text === "",
        latencyMs: serverMs, generatedTokens: genTokens
      };
      var cur = cmCursor();
      var total = text.length;
      sendEvents([ev("prediction_shown", {
        prediction_id: predictionId, provider: "tabcomplete-local", model: model,
        responded_at_ms: Date.now(), latency_ms: serverMs,
        context_hash: contextHash, file: docPath(), cursor: cur,
        proposed_start: cur, proposed_end: cur, proposed_text: text,
        max_output_tokens: toks, temperature: 0, total_chars: total,
        finish_reason: text === "" ? "noop" : "stop"
      }, cur)]);
      setText(sheetMeta, "· " + genTokens + " tokens · " + serverMs + " ms");
      if (pending.noop) {
        setText(sheetText, "NO_EDIT — keep the text unchanged.");
        acceptBtn.style.display = "none";
        setText(rejectBtn, "Dismiss");
      } else {
        setText(sheetText, text);
        acceptBtn.style.display = "";
        setText(acceptBtn, "Accept");
        setText(rejectBtn, "Reject");
      }
      sheet.hidden = false;
      renderGhost();
      status(serverMs + " ms · " + genTokens + " tokens");
      sheet.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }).catch(function (err) {
      status("Completion failed: " + (err && err.message ? err.message : String(err)), true);
    }).finally(function () {
      setBusy(false);
    });
  }

  function sendFeedback(action, comp) {
    if (!comp) return;
    fetch("/api/feedback", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        request_id: comp.id, action: action, model: comp.model, latency_ms: comp.latencyMs
      })
    }).catch(function () {});
  }

  function offsetToRowCol(full, offset) {
    var before = full.slice(0, offset).split("\n");
    return { row: before.length - 1, col: before[before.length - 1].length };
  }

  function acceptPending() {
    var done = takePending();
    if (!done) return;
    var full = cm.getValue();
    var from = cm.posFromIndex(done.start), to = cm.posFromIndex(done.end);
    cm.replaceRange(done.noop ? full.slice(done.start, done.end) : done.text, from, to);
    var next = done.noop ? done.end : done.start + done.text.length;
    cm.setCursor(cm.posFromIndex(next));
    cm.focus();
    var cur = cmCursor();
    var acceptedLines = done.noop ? 0 : done.text.split("\n").length;
    sendEvents([
      ev("edit_delta", {
        path: docPath(),
        start_row: offsetToRowCol(full, done.start).row,
        old_end_row: offsetToRowCol(full, done.end).row,
        new_end_row: cur.row,
        deleted_text: full.slice(done.start, done.end),
        inserted_text: done.noop ? full.slice(done.start, done.end) : done.text,
        cursor_after: cur
      }, cur),
      ev("prediction_accepted", {
        prediction_id: done.id, provider: "tabcomplete-local", model: done.model,
        file: docPath(), cursor: cur,
        accepted_chars: done.noop ? 0 : done.text.length,
        accepted_lines: acceptedLines, total_chars: done.text.length
      }, cur)
    ]);
    sendFeedback("accept", done);
    status("accepted ✓");
  }

  function rejectPending() {
    var done = takePending();
    if (!done) return;
    var cur = cmCursor();
    cm.focus();
    sendEvents([ev("prediction_rejected", {
      prediction_id: done.id, provider: "tabcomplete-local", model: done.model,
      file: docPath(), cursor: cur,
      total_chars: done.text.length, finish_reason: done.noop ? "noop_dismissed" : "dismissed"
    }, cur)]);
    sendFeedback("reject", done);
    status("rejected ✕");
  }

  /* ---- Wiring ---- */
  completeBtn.addEventListener("click", doComplete);
  acceptBtn.addEventListener("click", acceptPending);
  rejectBtn.addEventListener("click", rejectPending);
  settingsBtn.addEventListener("click", function () {
    var open = settings.hidden;
    settings.hidden = !open;
    settingsBtn.setAttribute("aria-expanded", open ? "true" : "false");
  });
  taskMode.addEventListener("change", function () {
    setText(completeBtn, taskMode.value === "next_edit" ? "Predict edit" : "Complete");
    supersedePending("superseded");
  });
  targetPath.addEventListener("change", function () { anchorBuffer("buffer_open"); });
  cm.setOption("extraKeys", {
    "Ctrl-Space": function () { doComplete(); },
    "Cmd-Space": function () { doComplete(); },
    "Tab": function () {
      if (pending) { acceptPending(); return; }
      cm.replaceSelection("    ", "end");
    },
    "Esc": function () { if (pending) rejectPending(); }
  });

  function loadModels() {
    fetch("/api/models").then(function (res) {
      if (!res.ok) throw new Error("GET /api/models: HTTP " + res.status);
      return res.json();
    }).then(function (data) {
      var models = (data && data.models) || [];
      while (modelSel.firstChild) modelSel.removeChild(modelSel.firstChild);
      if (!models.length) {
        var o = document.createElement("option");
        o.value = "";
        setText(o, "no models");
        modelSel.appendChild(o);
        return;
      }
      models.forEach(function (m) {
        var opt = document.createElement("option");
        opt.value = m.id;
        setText(opt, (m.label || m.id) + (m.format ? " (" + m.format + ")" : ""));
        modelSel.appendChild(opt);
      });
      fetch("/api/telemetry/status").then(function (r) { return r.json(); }).then(function (j) {
        markTelemetry(!!(j && j.reachable));
      }).catch(function () {});
    }).catch(function (err) {
      status("Could not load models: " + (err && err.message ? err.message : String(err)), true);
    });
  }

  loadModels();
  startSession();
})();
</script>
</body>
</html>
