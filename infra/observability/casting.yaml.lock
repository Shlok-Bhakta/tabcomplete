apiVersion: v1alpha1
kind: Installation
metadata:
  name: tabcomplete-observability
spec:
  deployment:
    flavor: compose
    mode: docker
  ingester:
    spec:
      cluster:
        replicas: 1
      config:
        data:
          ingester.yaml: |
            connectors:
              signozmeter:
                metrics_flush_interval: 1h
                dimensions:
                  - name: service.name
                  - name: deployment.environment
                  - name: host.name
            receivers:
              otlp:
                protocols:
                  grpc:
                    endpoint: "0.0.0.0:4317"
                  http:
                    endpoint: "0.0.0.0:4318"
            processors:
              batch:
                send_batch_size: 50000
                send_batch_max_size: 55000
                timeout: 5s
              batch/meter:
                send_batch_size: 20000
                send_batch_max_size: 25000
                timeout: 5s
              signozspanmetrics/delta:
                metrics_exporter: signozclickhousemetrics
                metrics_flush_interval: 60s
                latency_histogram_buckets:
                  - 100us
                  - 1ms
                  - 2ms
                  - 6ms
                  - 10ms
                  - 50ms
                  - 100ms
                  - 250ms
                  - 500ms
                  - 1000ms
                  - 1400ms
                  - 2000ms
                  - 5s
                  - 10s
                  - 20s
                  - 40s
                  - 60s
                dimensions_cache_size: 100000
                aggregation_temporality: AGGREGATION_TEMPORALITY_DELTA
                enable_exp_histogram: true
                dimensions:
                  - name: service.namespace
                    default: default
                  - name: deployment.environment
                    default: default
                  - name: signoz.collector.id
                  - name: service.version
            exporters:
              clickhousetraces:
                datasource: tcp://tabcomplete-observability-telemetrystore-clickhouse-0-0:9000/signoz_traces
                low_cardinal_exception_grouping: ${env:LOW_CARDINAL_EXCEPTION_GROUPING}
                use_new_schema: true
                timeout: 45s
                sending_queue:
                  enabled: false
              signozclickhousemetrics:
                dsn: tcp://tabcomplete-observability-telemetrystore-clickhouse-0-0:9000/signoz_metrics
                timeout: 45s
                sending_queue:
                  enabled: false
              clickhouselogsexporter:
                dsn: tcp://tabcomplete-observability-telemetrystore-clickhouse-0-0:9000/signoz_logs
                use_new_schema: true
                timeout: 45s
                sending_queue:
                  enabled: false
              signozclickhousemeter:
                dsn: tcp://tabcomplete-observability-telemetrystore-clickhouse-0-0:9000/signoz_meter
                timeout: 45s
                sending_queue:
                  enabled: false
              metadataexporter:
                enabled: true
                dsn: tcp://tabcomplete-observability-telemetrystore-clickhouse-0-0:9000/signoz_metadata
                timeout: 45s
                cache:
                  provider: in_memory
            extensions:
              signoz_health_check:
                endpoint: "0.0.0.0:13133"
              pprof:
                endpoint: "0.0.0.0:1777"
            service:
              telemetry:
                logs:
                  encoding: json
              extensions:
                - signoz_health_check
                - pprof
              pipelines:
                traces:
                  receivers:
                    - otlp
                  processors:
                    - signozspanmetrics/delta
                    - batch
                  exporters:
                    - clickhousetraces
                    - signozmeter
                    - metadataexporter
                metrics:
                  receivers:
                    - otlp
                  processors:
                    - batch
                  exporters:
                    - signozclickhousemetrics
                    - signozmeter
                    - metadataexporter
                logs:
                  receivers:
                    - otlp
                  processors:
                    - batch
                  exporters:
                    - clickhouselogsexporter
                    - signozmeter
                    - metadataexporter
                metrics/meter:
                  receivers:
                    - signozmeter
                  processors:
                    - batch/meter
                  exporters:
                    - signozclickhousemeter
          opamp.yaml: |
            server_endpoint: ws://tabcomplete-observability-signoz-0:4320/v1/opamp
      enabled: true
      env:
        SIGNOZ_OTEL_COLLECTOR_TIMEOUT: 10m
      image: signoz/signoz-otel-collector:v0.142.1@sha256:9278f7d9ba911e4facb5273364067c7aa606b9ef4e024a017ddfba51977cb3cc
      version: v0.142.1
    status:
      addresses:
        otlp:
        - tcp://tabcomplete-observability-ingester:4318
        - tcp://tabcomplete-observability-ingester:4317
      config:
        data:
          ingester.yaml: |
            connectors:
              signozmeter:
                metrics_flush_interval: 1h
                dimensions:
                  - name: service.name
                  - name: deployment.environment
                  - name: host.name
            receivers:
              otlp:
                protocols:
                  grpc:
                    endpoint: "0.0.0.0:4317"
                  http:
                    endpoint: "0.0.0.0:4318"
            processors:
              batch:
                send_batch_size: 50000
                send_batch_max_size: 55000
                timeout: 5s
              batch/meter:
                send_batch_size: 20000
                send_batch_max_size: 25000
                timeout: 5s
              signozspanmetrics/delta:
                metrics_exporter: signozclickhousemetrics
                metrics_flush_interval: 60s
                latency_histogram_buckets:
                  - 100us
                  - 1ms
                  - 2ms
                  - 6ms
                  - 10ms
                  - 50ms
                  - 100ms
                  - 250ms
                  - 500ms
                  - 1000ms
                  - 1400ms
                  - 2000ms
                  - 5s
                  - 10s
                  - 20s
                  - 40s
                  - 60s
                dimensions_cache_size: 100000
                aggregation_temporality: AGGREGATION_TEMPORALITY_DELTA
                enable_exp_histogram: true
                dimensions:
                  - name: service.namespace
                    default: default
                  - name: deployment.environment
                    default: default
                  - name: signoz.collector.id
                  - name: service.version
            exporters:
              clickhousetraces:
                datasource: tcp://tabcomplete-observability-telemetrystore-clickhouse-0-0:9000/signoz_traces
                low_cardinal_exception_grouping: ${env:LOW_CARDINAL_EXCEPTION_GROUPING}
                use_new_schema: true
                timeout: 45s
                sending_queue:
                  enabled: false
              signozclickhousemetrics:
                dsn: tcp://tabcomplete-observability-telemetrystore-clickhouse-0-0:9000/signoz_metrics
                timeout: 45s
                sending_queue:
                  enabled: false
              clickhouselogsexporter:
                dsn: tcp://tabcomplete-observability-telemetrystore-clickhouse-0-0:9000/signoz_logs
                use_new_schema: true
                timeout: 45s
                sending_queue:
                  enabled: false
              signozclickhousemeter:
                dsn: tcp://tabcomplete-observability-telemetrystore-clickhouse-0-0:9000/signoz_meter
                timeout: 45s
                sending_queue:
                  enabled: false
              metadataexporter:
                enabled: true
                dsn: tcp://tabcomplete-observability-telemetrystore-clickhouse-0-0:9000/signoz_metadata
                timeout: 45s
                cache:
                  provider: in_memory
            extensions:
              signoz_health_check:
                endpoint: "0.0.0.0:13133"
              pprof:
                endpoint: "0.0.0.0:1777"
            service:
              telemetry:
                logs:
                  encoding: json
              extensions:
                - signoz_health_check
                - pprof
              pipelines:
                traces:
                  receivers:
                    - otlp
                  processors:
                    - signozspanmetrics/delta
                    - batch
                  exporters:
                    - clickhousetraces
                    - signozmeter
                    - metadataexporter
                metrics:
                  receivers:
                    - otlp
                  processors:
                    - batch
                  exporters:
                    - signozclickhousemetrics
                    - signozmeter
                    - metadataexporter
                logs:
                  receivers:
                    - otlp
                  processors:
                    - batch
                  exporters:
                    - clickhouselogsexporter
                    - signozmeter
                    - metadataexporter
                metrics/meter:
                  receivers:
                    - signozmeter
                  processors:
                    - batch/meter
                  exporters:
                    - signozclickhousemeter
          opamp.yaml: |
            server_endpoint: ws://tabcomplete-observability-signoz-0:4320/v1/opamp
      env:
        SIGNOZ_OTEL_COLLECTOR_TIMEOUT: 10m
  mcp:
    spec:
      cluster:
        replicas: 1
      config: {}
      enabled: true
      env:
        MCP_SERVER_PORT: "8000"
        SIGNOZ_URL: http://tabcomplete-observability-signoz-0:8080
        TRANSPORT_MODE: http
      image: signoz/signoz-mcp-server:v0.14.0@sha256:5a71dd65958aa0504622072b654fad9b0555703f909aafa578f53fb50f2481a2
      version: v0.14.0
    status:
      addresses:
        http:
        - http://tabcomplete-observability-mcp:8000
      config: {}
      env:
        MCP_SERVER_PORT: "8000"
        SIGNOZ_URL: http://tabcomplete-observability-signoz-0:8080
        TRANSPORT_MODE: http
  metastore:
    kind: postgres
    spec:
      cluster:
        replicas: 1
      config: {}
      enabled: true
      env:
        POSTGRES_DB: signoz
        POSTGRES_PASSWORD: signoz
        POSTGRES_USER: signoz
      image: postgres:16@sha256:a85daf0dbd5e79586e850e3fe4b21b796799828ad015ce2166aeb98cc24da61c
      version: "16"
    status:
      addresses:
        dsn:
        - tcp://tabcomplete-observability-metastore-postgres-0:5432
      config: {}
      env:
        POSTGRES_DB: signoz
        POSTGRES_PASSWORD: signoz
        POSTGRES_USER: signoz
  patches:
  - operations:
    - op: replace
      path: /services/tabcomplete-observability-metastore-postgres-0/environment/1
      value: POSTGRES_PASSWORD=${TABCOMPLETE_OBS_POSTGRES_PASSWORD:?set private metastore
        password}
    - op: replace
      path: /services/tabcomplete-observability-signoz-0/environment/0
      value: SIGNOZ_SQLSTORE_POSTGRES_DSN=postgres://signoz:${TABCOMPLETE_OBS_POSTGRES_PASSWORD:?set
        private metastore password}@tabcomplete-observability-metastore-postgres-0:5432/signoz?sslmode=disable
    - op: add
      path: /services/tabcomplete-observability-signoz-0/depends_on
      value:
        tabcomplete-observability-metastore-postgres-0:
          condition: service_healthy
    - op: replace
      path: /services/ingester/ports
      value:
      - ${TABCOMPLETE_OBS_TAILSCALE_IP:?set Tailscale IP}:${TABCOMPLETE_OBS_OTLP_GRPC_PORT:-4317}:4317
      - ${TABCOMPLETE_OBS_TAILSCALE_IP:?set Tailscale IP}:${TABCOMPLETE_OBS_OTLP_HTTP_PORT:-4318}:4318
    - op: add
      path: /services/ingester/volumes/-
      value:
        bind:
          create_host_path: false
        source: ${TABCOMPLETE_OBS_DATA_ROOT:?set verified storage root}/collector-wal
        target: /var/lib/otelcol
        type: bind
    - op: add
      path: /services/ingester/mem_limit
      value: 1g
    - op: replace
      path: /services/mcp/ports
      value:
      - ${TABCOMPLETE_OBS_TAILSCALE_IP:?set Tailscale IP}:${TABCOMPLETE_OBS_MCP_PORT:-8000}:8000
    - op: add
      path: /services/mcp/environment/-
      value: SIGNOZ_API_KEY=${SIGNOZ_API_KEY:?set read-only service key}
    - op: add
      path: /services/mcp/mem_limit
      value: 256m
    - op: replace
      path: /services/tabcomplete-observability-signoz-0/ports
      value:
      - ${TABCOMPLETE_OBS_TAILSCALE_IP:?set Tailscale IP}:${TABCOMPLETE_OBS_SIGNOZ_PORT:-8080}:8080
    - op: add
      path: /services/tabcomplete-observability-signoz-0/mem_limit
      value: 1536m
    - op: replace
      path: /services/tabcomplete-observability-metastore-postgres-0/volumes/0
      value:
        bind:
          create_host_path: false
        source: ${TABCOMPLETE_OBS_DATA_ROOT:?set verified storage root}/metastore
        target: /var/lib/postgresql/data
        type: bind
    - op: add
      path: /services/tabcomplete-observability-metastore-postgres-0/mem_limit
      value: 512m
    - op: replace
      path: /services/tabcomplete-observability-telemetrykeeper-clickhousekeeper-0/volumes/0
      value:
        bind:
          create_host_path: false
        source: ${TABCOMPLETE_OBS_DATA_ROOT:?set verified storage root}/keeper
        target: /var/lib/clickhouse-keeper
        type: bind
    - op: add
      path: /services/tabcomplete-observability-telemetrykeeper-clickhousekeeper-0/mem_limit
      value: 512m
    - op: add
      path: /services/tabcomplete-observability-telemetrykeeper-clickhousekeeper-0/volumes/-
      value:
        bind:
          create_host_path: false
        source: ${TABCOMPLETE_OBS_DATA_ROOT:?set verified storage root}/keeper-image-state
        target: /var/lib/clickhouse
        type: bind
    - op: replace
      path: /services/tabcomplete-observability-telemetrystore-clickhouse-0-0/volumes/0
      value:
        bind:
          create_host_path: false
        source: ${TABCOMPLETE_OBS_DATA_ROOT:?set verified storage root}/clickhouse
        target: /var/lib/clickhouse
        type: bind
    - op: replace
      path: /services/tabcomplete-observability-telemetrystore-clickhouse-0-0/volumes/1
      value:
        bind:
          create_host_path: false
        read_only: true
        source: ${TABCOMPLETE_OBS_DATA_ROOT:?set verified storage root}/clickhouse-user-scripts
        target: /var/lib/clickhouse/user_scripts
        type: bind
    - op: add
      path: /services/tabcomplete-observability-telemetrystore-clickhouse-0-0/mem_limit
      value: 4g
    - op: replace
      path: /services/tabcomplete-observability-telemetrystore-clickhouse-user-scripts/volumes/0
      value:
        bind:
          create_host_path: false
        source: ${TABCOMPLETE_OBS_DATA_ROOT:?set verified storage root}/clickhouse-user-scripts
        target: /var/lib/clickhouse/user_scripts
        type: bind
    - op: add
      path: /services/tabcomplete-observability-telemetrystore-migrator/mem_limit
      value: 512m
    - op: add
      path: /services/gateway
      value:
        build:
          context: ../../gateway
        depends_on:
          tabcomplete-observability-signoz-0:
            condition: service_healthy
        environment:
        - PORT=9090
        - SIGNOZ_URL=http://tabcomplete-observability-signoz-0:8080
        - TABCOMPLETE_ARTIFACT_ROOT=/artifacts
        - SIGNOZ_API_KEY=${SIGNOZ_API_KEY:?set read-only service key}
        - TABCOMPLETE_ARTIFACT_UPLOAD_TOKEN=${TABCOMPLETE_ARTIFACT_UPLOAD_TOKEN:?set
          upload token}
        - TABCOMPLETE_ARTIFACT_CAP_BYTES=${TABCOMPLETE_ARTIFACT_CAP_BYTES:-21474836480}
        - TABCOMPLETE_ARTIFACT_RETENTION_DAYS=${TABCOMPLETE_ARTIFACT_RETENTION_DAYS:-30}
        - TABCOMPLETE_ALLOWED_HOSTS=${TABCOMPLETE_OBS_ALLOWED_HOSTS:?set allowed hosts}
        healthcheck:
          interval: 15s
          retries: 5
          start_period: 20s
          test:
          - CMD
          - bun
          - -e
          - fetch('http://127.0.0.1:9090/api/v1/status',{headers:{Host:'kiwi'}}).then(r=>{if(!r.ok)process.exit(1)})
          timeout: 5s
        image: tabcomplete-observability-gateway:1.0.0
        mem_limit: 256m
        networks:
        - tabcomplete-observability-network
        pids_limit: 128
        ports:
        - ${TABCOMPLETE_OBS_TAILSCALE_IP:?set Tailscale IP}:${TABCOMPLETE_OBS_GATEWAY_PORT:-9090}:9090
        restart: unless-stopped
        volumes:
        - bind:
            create_host_path: false
          source: ${TABCOMPLETE_OBS_DATA_ROOT:?set verified storage root}/model-artifacts
          target: /artifacts
          type: bind
        - bind:
            create_host_path: false
          source: ${TABCOMPLETE_OBS_DATA_ROOT:?set verified storage root}/gateway-state
          target: /state
          type: bind
    - op: remove
      path: /volumes
    target: deployment/compose.yaml
  - operations:
    - op: add
      path: /services/ingester/logging
      value:
        driver: json-file
        options:
          max-file: "3"
          max-size: 10m
    - op: add
      path: /services/mcp/logging
      value:
        driver: json-file
        options:
          max-file: "3"
          max-size: 10m
    - op: add
      path: /services/tabcomplete-observability-metastore-postgres-0/logging
      value:
        driver: json-file
        options:
          max-file: "3"
          max-size: 10m
    - op: add
      path: /services/tabcomplete-observability-signoz-0/logging
      value:
        driver: json-file
        options:
          max-file: "3"
          max-size: 10m
    - op: add
      path: /services/tabcomplete-observability-telemetrykeeper-clickhousekeeper-0/logging
      value:
        driver: json-file
        options:
          max-file: "3"
          max-size: 10m
    - op: add
      path: /services/tabcomplete-observability-telemetrystore-clickhouse-0-0/logging
      value:
        driver: json-file
        options:
          max-file: "3"
          max-size: 10m
    - op: add
      path: /services/tabcomplete-observability-telemetrystore-clickhouse-user-scripts/logging
      value:
        driver: json-file
        options:
          max-file: "3"
          max-size: 10m
    - op: add
      path: /services/tabcomplete-observability-telemetrystore-migrator/logging
      value:
        driver: json-file
        options:
          max-file: "3"
          max-size: 10m
    - op: add
      path: /services/gateway/logging
      value:
        driver: json-file
        options:
          max-file: "3"
          max-size: 10m
    target: deployment/compose.yaml
  - operations:
    - op: add
      path: /services/ingester/tmpfs
      value:
      - /tmp:size=64m,mode=1777
    - op: add
      path: /services/mcp/tmpfs
      value:
      - /tmp:size=64m,mode=1777
    - op: add
      path: /services/tabcomplete-observability-signoz-0/tmpfs
      value:
      - /tmp:size=64m,mode=1777
    - op: add
      path: /services/tabcomplete-observability-metastore-postgres-0/tmpfs
      value:
      - /tmp:size=64m,mode=1777
    - op: add
      path: /services/tabcomplete-observability-telemetrykeeper-clickhousekeeper-0/tmpfs
      value:
      - /tmp:size=64m,mode=1777
    - op: add
      path: /services/tabcomplete-observability-telemetrystore-clickhouse-0-0/tmpfs
      value:
      - /tmp:size=64m,mode=1777
    - op: add
      path: /services/tabcomplete-observability-telemetrystore-migrator/tmpfs
      value:
      - /tmp:size=64m,mode=1777
    - op: add
      path: /services/gateway/tmpfs
      value:
      - /tmp:size=64m,mode=1777
    - op: add
      path: /services/ingester/volumes/-
      value:
        bind:
          create_host_path: false
        read_only: true
        source: ${TABCOMPLETE_OBS_DATA_ROOT:?set verified storage root}/.volume-identity.json
        target: /etc/tabcomplete-volume-identity.json
        type: bind
    - op: add
      path: /services/tabcomplete-observability-signoz-0/volumes
      value: []
    - op: add
      path: /services/tabcomplete-observability-signoz-0/volumes/-
      value:
        bind:
          create_host_path: false
        read_only: true
        source: ${TABCOMPLETE_OBS_DATA_ROOT:?set verified storage root}/.volume-identity.json
        target: /etc/tabcomplete-volume-identity.json
        type: bind
    - op: add
      path: /services/tabcomplete-observability-metastore-postgres-0/volumes/-
      value:
        bind:
          create_host_path: false
        read_only: true
        source: ${TABCOMPLETE_OBS_DATA_ROOT:?set verified storage root}/.volume-identity.json
        target: /etc/tabcomplete-volume-identity.json
        type: bind
    - op: add
      path: /services/tabcomplete-observability-telemetrykeeper-clickhousekeeper-0/volumes/-
      value:
        bind:
          create_host_path: false
        read_only: true
        source: ${TABCOMPLETE_OBS_DATA_ROOT:?set verified storage root}/.volume-identity.json
        target: /etc/tabcomplete-volume-identity.json
        type: bind
    - op: add
      path: /services/tabcomplete-observability-telemetrystore-clickhouse-0-0/volumes/-
      value:
        bind:
          create_host_path: false
        read_only: true
        source: ${TABCOMPLETE_OBS_DATA_ROOT:?set verified storage root}/.volume-identity.json
        target: /etc/tabcomplete-volume-identity.json
        type: bind
    - op: add
      path: /services/gateway/volumes/-
      value:
        bind:
          create_host_path: false
        read_only: true
        source: ${TABCOMPLETE_OBS_DATA_ROOT:?set verified storage root}/.volume-identity.json
        target: /etc/tabcomplete-volume-identity.json
        type: bind
    target: deployment/compose.yaml
  - operations:
    - op: replace
      path: /processors/batch/send_batch_size
      value: 1024
    - op: replace
      path: /processors/batch/send_batch_max_size
      value: 2048
    - op: replace
      path: /processors/batch~1meter/send_batch_size
      value: 1024
    - op: replace
      path: /processors/batch~1meter/send_batch_max_size
      value: 2048
    - op: add
      path: /extensions/file_storage
      value:
        compaction:
          on_start: true
          rebound_needed_threshold_mib: 256
          rebound_trigger_threshold_mib: 32
        create_directory: true
        directory: /var/lib/otelcol
        timeout: 1s
    - op: add
      path: /processors/memory_limiter
      value:
        check_interval: 1s
        limit_mib: 768
        spike_limit_mib: 192
    - op: add
      path: /service/extensions/-
      value: file_storage
    - op: add
      path: /service/pipelines/traces/processors/0
      value: memory_limiter
    - op: add
      path: /service/pipelines/metrics/processors/0
      value: memory_limiter
    - op: add
      path: /service/pipelines/logs/processors/0
      value: memory_limiter
    - op: replace
      path: /exporters/clickhousetraces/sending_queue
      value:
        enabled: true
        num_consumers: 2
        queue_size: 134217728
        sizer: bytes
        storage: file_storage
    - op: replace
      path: /exporters/signozclickhousemetrics/sending_queue
      value:
        enabled: true
        num_consumers: 2
        queue_size: 134217728
        sizer: bytes
        storage: file_storage
    - op: replace
      path: /exporters/clickhouselogsexporter/sending_queue
      value:
        enabled: true
        num_consumers: 2
        queue_size: 134217728
        sizer: bytes
        storage: file_storage
    - op: replace
      path: /exporters/signozclickhousemeter/sending_queue
      value:
        enabled: true
        num_consumers: 2
        queue_size: 134217728
        sizer: bytes
        storage: file_storage
    target: deployment/ingester/ingester.yaml
  signoz:
    spec:
      cluster:
        replicas: 1
      config: {}
      enabled: true
      env:
        SIGNOZ_SQLSTORE_POSTGRES_DSN: postgres://signoz:signoz@tabcomplete-observability-metastore-postgres-0:5432/signoz?sslmode=disable
        SIGNOZ_SQLSTORE_PROVIDER: postgres
        SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN: tcp://tabcomplete-observability-telemetrystore-clickhouse-0-0:9000
        SIGNOZ_TELEMETRYSTORE_PROVIDER: clickhouse
      image: signoz/signoz:v0.142.1@sha256:9ee744714fced5b51db763e338d4bce4b6914941c56c11f5c14616497d7eabb7
      version: v0.142.1
    status:
      addresses:
        apiserver:
        - tcp://tabcomplete-observability-signoz-0:8080
        opamp:
        - ws://tabcomplete-observability-signoz-0:4320
      config: {}
      env:
