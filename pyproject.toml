[project]
name = "tinycomplete"
version = "0.1.0"
description = "Tiny local code next-edit/autocomplete engine (Qwen3.5-0.8B experiment infrastructure)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "tinycomplete" }]
dependencies = [
  "pydantic>=2.0",
  "typer>=0.9",
  "httpx>=0.27",
  "tenacity>=8.0",
  "orjson>=3.9",
  "pyyaml>=6.0",
  "tree-sitter>=0.25",
  "tree-sitter-language-pack>=0.1",
  "unidiff>=0.7",
  "huggingface-hub>=0.23",
  "transformers>=4.57",
  "tokenizers>=0.21",
  "safetensors>=0.4",
  "numpy>=1.26",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "mypy>=1.10",
]

[project.scripts]
tinycomplete = "tinycomplete.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tinycomplete"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.tinycomplete]
model_id = "Qwen/Qwen3.5-0.8B-Base"
