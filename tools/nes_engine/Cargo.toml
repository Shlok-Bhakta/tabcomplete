[package]
name = "tabcomplete-nes"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "CPU next-edit engine for Sweep next-edit models with a fast workspace context engine"

[[bin]]
name = "tabcomplete-nes"
path = "src/main.rs"

[features]
cuda = ["llama-cpp-2/cuda", "llama-cpp-2/cuda-no-vmm"]
openmp = ["llama-cpp-2/openmp"]

[dependencies]
llama-cpp-2 = { version = "=0.1.160", default-features = false }
llama-cpp-sys-2 = { version = "=0.1.160", default-features = false }
axum = { version = "0.8", features = ["json"] }
futures-util = { version = "0.3", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
ignore = "0.4"
rayon = "1"
similar = "2"
tree-sitter = "=0.25.10"
tree-sitter-rust = "=0.24.0"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-go = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-java = "0.23"
tree-sitter-lua = "0.2"
tree-sitter-nix = "0.3"
tree-sitter-bash = "0.25"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
