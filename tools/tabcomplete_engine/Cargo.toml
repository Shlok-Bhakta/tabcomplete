[package]
name = "tabcomplete-engine"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
llama-cpp-2 = { version = "=0.1.157", default-features = false }
llama-cpp-sys-2 = { version = "=0.1.158", default-features = false }
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
libc = "=0.2.189"
tree-sitter = "=0.25.10"
tree-sitter-rust = "=0.24.0"
unicode-normalization = "=0.1.24"

[profile.release]
lto = "thin"
codegen-units = 1

[patch.crates-io]
llama-cpp-2 = { path = "vendor/llama-cpp-2" }
