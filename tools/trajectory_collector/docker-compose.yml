services:
  collector:
    build: ./server
    image: tabcomplete-trajectory-collector:latest
    container_name: tabcomplete-collector
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TABCOMPLETE_COLLECTOR_DB: /data/collector.sqlite
      TABCOMPLETE_COLLECTOR_PORT: "8787"
    ports:
      - "${TABCOMPLETE_TAILSCALE_BIND_ADDR}:${TABCOMPLETE_COLLECTOR_PORT:-8787}:8787"
    volumes:
      - /mnt/ssd/collector-data:/data
    healthcheck:
      # CMD-SHELL string form: podman-compose mangles multi-arg CMD arrays
      # through /bin/sh (JS parentheses break it). A plain command string
      # passes through intact. See server/healthcheck.ts.
      test: ["CMD-SHELL", "bun ./healthcheck.ts"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
