# Teacher configuration example. Copy to teacher.toml (NEVER commit real keys).
# Secrets come from environment variables only: OPENROUTER_API_KEY, DEEPSEEK_API_KEY.
# Paid generation additionally requires ALLOW_PAID_SYNTHETIC=1.

[teacher]
provider = "fake"  # fake | openrouter | deepseek
openrouter_model = "meta/muse-spark-1.3-contributor"  # VERIFY via /api/v1/models before paid calls
deepseek_model = "deepseek-flash"  # cheap tier, verified via GET /models 2026-09-17

[budget]
max_total_spend_usd = 2.00
max_paid_examples = 2000
max_candidates_per_state = 3

# Conservative per-1k-token price estimates (USD) used ONLY when the provider
# reports no exact cost; a 50% safety margin is added on top. Replace with
# live pricing recorded in reports/synthetic.md before any paid run.
[pricing_estimates]
openrouter_in_per_1k = 0.010
openrouter_out_per_1k = 0.030
deepseek_in_per_1k = 0.010
deepseek_out_per_1k = 0.030
